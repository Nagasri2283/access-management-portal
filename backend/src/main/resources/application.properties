spring.application.name=access-portal

# --- PostgreSQL ---
# Create this database locally first: CREATE DATABASE access_portal;
spring.datasource.url=jdbc:postgresql://localhost:5432/access_portal
spring.datasource.username=postgres
spring.datasource.password=Nagasri@22083

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
